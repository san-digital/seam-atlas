[package]
name = "seam-atlas"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Compare two versions of a first-match rules file on every input, and find inputs where a one-step change flips the outcome."
repository = "https://github.com/san-digital/seam-atlas"
homepage = "https://github.com/san-digital/seam-atlas"
documentation = "https://docs.rs/seam-atlas"
readme = "README.md"
keywords = ["policy", "diff", "rule-engine", "verification", "testing"]
categories = ["development-tools::testing", "command-line-utilities"]
include = [
    "/src",
    "/tests",
    "/policies",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[[bin]]
name = "seam-atlas"
path = "src/bin/seam_atlas.rs"

[dependencies]

[workspace]
